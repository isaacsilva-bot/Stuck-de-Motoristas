<script>
  // URL direta da API GViz do Google Sheets (não precisa de proxy e não dá bloqueio de CORS)
  const SHEET_ID = '1vSQMATMAFhb-UsfR4uX-nmjZRS4kJEXWBYcp0-EezWCZVDuSasM7uEnZuSmFxMJHOrfEdcqlL27pZGY'; // Extraído do seu link original
  const CSV_URL = `https://docs.google.com/spreadsheets/d/e/2PACX-${SHEET_ID}/pub?gid=0&single=true&output=csv`;

  const camposPermitidos = [
    { key: 'data_coleta', labels: ['data_coleta', 'data coleta', 'Data Coleta'] },
    { key: 'codigo_br', labels: ['codigo_br', 'Código do Pacote', 'codigo do pacote', 'codigo_pacote'] },
    { key: 'nome_motorista', labels: ['nome_motorista', 'Motorista', 'motorista', 'Nome Motorista'] },
    { key: 'shop_id', labels: ['shop_id', 'Shop ID', 'shop id'] },
    { key: 'loja', labels: ['loja', 'Loja'] },
    { key: 'cidade_loja', labels: ['cidade_loja', 'Cidade Loja', 'cidade'] },
    { key: 'valor_pacote_brl', labels: ['valor_pacote_brl', 'Valor Pacote (BRL)', 'valor_pacote'] }
  ];

  function parseCSV(text) {
    const lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
    if (lines.length === 0) return [];

    const headers = lines[0].split(',').map(h => h.replace(/^"(.*)"$/, '$1').trim());

    return lines.slice(1).map(line => {
      const values = line.split(/,(?=(?:[^\"]*\"[^\"]*\")*[^\"]*$)/);
      const row = {};
      headers.forEach((header, index) => {
        let val = values[index] ? values[index].trim() : '';
        val = val.replace(/^"(.*)"$/, '$1').trim();
        row[header] = val;
      });
      return row;
    });
  }

  function obterValorColuna(row, aliases) {
    for (const alias of aliases) {
      const chaveEncontrada = Object.keys(row).find(k => k.trim().toLowerCase() === alias.toLowerCase());
      if (chaveEncontrada && row[chaveEncontrada] !== undefined && row[chaveEncontrada] !== '') {
        return row[chaveEncontrada];
      }
    }
    return 'N/A';
  }

  async function buscarInformacoes() {
    const idBuscado = document.getElementById('idInput').value.trim();
    const statusDiv = document.getElementById('status');
    const cardsGrid = document.getElementById('cardsGrid');

    if (!idBuscado) {
      statusDiv.className = 'status-msg error';
      statusDiv.innerText = 'Por favor, digite um ID para buscar.';
      cardsGrid.innerHTML = '';
      return;
    }

    statusDiv.className = 'status-msg loading';
    statusDiv.innerText = 'Carregando dados...';
    cardsGrid.innerHTML = '';

    try {
      // Faz o fetch direto da URL publicada pelo Google Sheets
      const response = await fetch(CSV_URL);
      if (!response.ok) throw new Error('Falha ao baixar os dados');

      const csvText = await response.text();
      const dados = parseCSV(csvText);

      const registrosEncontrados = dados.filter(item => {
        const primeiraChave = Object.keys(item)[0];
        const idColuna = item['driver_id'] || item['ID'] || item['id'] || item[primeiraChave];
        return idColuna && String(idColuna).trim().toLowerCase() === idBuscado.toLowerCase();
      });

      if (registrosEncontrados.length > 0) {
        statusDiv.innerText = '';

        registrosEncontrados.forEach(registro => {
          const card = document.createElement('div');
          card.className = 'info-card';

          camposPermitidos.forEach(campo => {
            const valor = obterValorColuna(registro, campo.labels);

            const itemDiv = document.createElement('div');
            itemDiv.className = 'info-item';

            const label = document.createElement('span');
            label.className = 'info-label';
            label.innerText = campo.key;

            const val = document.createElement('span');
            val.className = 'info-value';
            val.innerText = valor;

            itemDiv.appendChild(label);
            itemDiv.appendChild(val);
            card.appendChild(itemDiv);
          });

          cardsGrid.appendChild(card);
        });
      } else {
        statusDiv.className = 'status-msg error';
        statusDiv.innerText = 'Nenhum registro encontrado para este ID.';
      }
    } catch (error) {
      console.error(error);
      statusDiv.className = 'status-msg error';
      statusDiv.innerText = 'Erro ao se conectar com a base de dados. Tente novamente mais tarde.';
    }
  }
</script>
