<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stuck de Motoristas - Consulta por ID</title>
  <!-- Biblioteca PapaParse para leitura fácil de CSV -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      text-align: center;
      color: var(--text);
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 24px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    .result-card {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 20px;
      display: none;
    }

    .info-group {
      margin-bottom: 12px;
    }

    .info-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      color: #64748b;
      font-weight: 600;
      margin-bottom: 2px;
    }

    .info-value {
      font-size: 1.1rem;
      color: var(--text);
      word-break: break-word;
    }

    .status-msg {
      text-align: center;
      margin-top: 15px;
      font-size: 0.95rem;
    }

    .error {
      color: #ef4444;
    }

    .loading {
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Stuck de Motoristas</h1>
    <p class="subtitle">Digite o seu ID intransferível para consultar as informações.</p>
    
    <div class="search-box">
      <input type="text" id="idInput" placeholder="Digite seu ID..." />
      <button onclick="buscarInformacoes()">Buscar</button>
    </div>

    <div id="status" class="status-msg"></div>

    <div id="resultCard" class="result-card"></div>
  </div>

  <script>
    // URL via Corsproxy para evitar bloqueios do navegador
    const CSV_URL = 'https://corsproxy.io/?' + encodeURIComponent('https://docs.google.com/spreadsheets/d/e/2PACX-1vSQMATMAFhb-UsfR4uX-nmjZRS4kJEXWBYcp0-EezWCZVDuSasM7uEnZuSmFxMJHOrfEdcqlL27pZGY/pub?gid=0&single=true&output=csv');

    function buscarInformacoes() {
      const idBuscado = document.getElementById('idInput').value.trim();
      const statusDiv = document.getElementById('status');
      const resultCard = document.getElementById('resultCard');

      if (!idBuscado) {
        statusDiv.className = 'status-msg error';
        statusDiv.innerText = 'Por favor, digite um ID para buscar.';
        resultCard.style.display = 'none';
        return;
      }

      statusDiv.className = 'status-msg loading';
      statusDiv.innerText = 'Carregando dados...';
      resultCard.style.display = 'none';

      // PapaParse faz o download e interpretação automática do CSV
      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const dados = results.data;

          // Localiza a linha equivalente ao ID digitado
          const registroEncontrado = dados.find(item => {
            const primeiraChave = Object.keys(item)[0];
            const idColuna = item['ID'] || item['id'] || item[primeiraChave];
            return idColuna && String(idColuna).trim().toLowerCase() === idBuscado.toLowerCase();
          });

          if (registroEncontrado) {
            statusDiv.innerText = '';
            resultCard.innerHTML = '';

            Object.entries(registroEncontrado).forEach(([coluna, valor]) => {
              const group = document.createElement('div');
              group.className = 'info-group';

              const label = document.createElement('div');
              label.className = 'info-label';
              label.innerText = coluna;

              const val = document.createElement('div');
              val.className = 'info-value';
              val.innerText = valor || 'N/A';

              group.appendChild(label);
              group.appendChild(val);
              resultCard.appendChild(group);
            });

            resultCard.style.display = 'block';
          } else {
            statusDiv.className = 'status-msg error';
            statusDiv.innerText = 'ID não encontrado. Por favor, confirme se digitou corretamente.';
          }
        },
        error: function(err) {
          console.error(err);
          statusDiv.className = 'status-msg error';
          statusDiv.innerText = 'Erro ao se conectar com a base de dados. Tente novamente mais tarde.';
        }
      });
    }
  </script>
</body>
</html>
