<script>
  // ID público da sua planilha do Google
  const SPREADSHEET_ID = '1vSQMATMAFhb-UsfR4uX-nmjZRS4kJEXWBYcp0-EezWCZVDuSasM7uEnZuSmFxMJHOrfEdcqlL27pZGY';

  const camposPermitidos = [
    { key: 'data_coleta', labels: ['data_coleta', 'data coleta', 'Data Coleta'] },
    { key: 'codigo_br', labels: ['codigo_br', 'Código do Pacote', 'codigo do pacote', 'codigo_pacote'] },
    { key: 'nome_motorista', labels: ['nome_motorista', 'Motorista', 'motorista', 'Nome Motorista'] },
    { key: 'shop_id', labels: ['shop_id', 'Shop ID', 'shop id'] },
    { key: 'loja', labels: ['loja', 'Loja'] },
    { key: 'cidade_loja', labels: ['cidade_loja', 'Cidade Loja', 'cidade'] },
    { key: 'valor_pacote_brl', labels: ['valor_pacote_brl', 'Valor Pacote (BRL)', 'valor_pacote'] }
  ];

  let dadosCarregados = null;

  // Função Global de Callback chamada pela API do Google Sheets via JSONP
  window.processarDadosGoogle = function(jsonPayload) {
    if (!jsonPayload || !jsonPayload.table) {
      exibirErro('Erro ao ler a estrutura da planilha.');
      return;
    }

    const cols = jsonPayload.table.cols.map(c => c ? c.label : '');
    const rows = jsonPayload.table.rows;

    dadosCarregados = rows.map(r => {
      const obj = {};
      r.c.forEach((cell, idx) => {
        const colName = cols[idx] || `col_${idx}`;
        obj[colName] = cell ? (cell.v !== null ? String(cell.v) : '') : '';
      });
      return obj;
    });

    executarFiltroEPintar();
  };

  function obterValorColuna(row, aliases) {
    for (const alias of aliases) {
      const chaveEncontrada = Object.keys(row).find(k => k.trim().toLowerCase() === alias.toLowerCase());
      if (chaveEncontrada && row[chaveEncontrada] !== undefined && row[chaveEncontrada] !== '') {
        return row[chaveEncontrada];
      }
    }
    return 'N/A';
  }

  function exibirErro(mensagem) {
    const statusDiv = document.getElementById('status');
    const cardsGrid = document.getElementById('cardsGrid');
    statusDiv.className = 'status-msg error';
    statusDiv.innerText = mensagem;
    cardsGrid.innerHTML = '';
  }

  function executarFiltroEPintar() {
    const idBuscado = document.getElementById('idInput').value.trim();
    const statusDiv = document.getElementById('status');
    const cardsGrid = document.getElementById('cardsGrid');

    if (!dadosCarregados || dadosCarregados.length === 0) {
      exibirErro('Nenhum dado retornado da planilha.');
      return;
    }

    const registrosEncontrados = dadosCarregados.filter(item => {
      const primeiraChave = Object.keys(item)[0];
      const idColuna = item['driver_id'] || item['ID'] || item['id'] || item[primeiraChave];
      return idColuna && String(idColuna).trim().toLowerCase() === idBuscado.toLowerCase();
    });

    if (registrosEncontrados.length > 0) {
      statusDiv.innerText = '';
      cardsGrid.innerHTML = '';

      registrosEncontrados.forEach(registro => {
        const card = document.createElement('div');
        card.className = 'info-card';

        camposPermitidos.forEach(campo => {
          const valor = obterValorColuna(registro, campo.labels);

          const itemDiv = document.createElement('div');
          itemDiv.className = 'info-item';

          const label = document.createElement('span');
          label.className = 'info-label';
          label.innerText = campo.key;

          const val = document.createElement('span');
          val.className = 'info-value';
          val.innerText = valor;

          itemDiv.appendChild(label);
          itemDiv.appendChild(val);
          card.appendChild(itemDiv);
        });

        cardsGrid.appendChild(card);
      });
    } else {
      exibirErro('Nenhum registro encontrado para este ID.');
    }
  }

  function buscarInformacoes() {
    const idBuscado = document.getElementById('idInput').value.trim();
    const statusDiv = document.getElementById('status');
    const cardsGrid = document.getElementById('cardsGrid');

    if (!idBuscado) {
      exibirErro('Por favor, digite um ID para buscar.');
      return;
    }

    statusDiv.className = 'status-msg loading';
    statusDiv.innerText = 'Carregando dados...';
    cardsGrid.innerHTML = '';

    // Remove script antigo se existir
    const oldScript = document.getElementById('gviz-script');
    if (oldScript) oldScript.remove();

    // Cria tag <script> dinamicamente para burlar o bloqueio de CORS (JSONP)
    const script = document.createElement('script');
    script.id = 'gviz-script';
    script.src = `https://docs.google.com/spreadsheets/d/e/2PACX-${SPREADSHEET_ID}/gviz/tq?tqx=responseHandler:processarDadosGoogle`;
    
    script.onerror = () => {
      exibirErro('Erro ao se conectar com a base de dados. Tente novamente mais tarde.');
    };

    document.body.appendChild(script);
  }
</script>
